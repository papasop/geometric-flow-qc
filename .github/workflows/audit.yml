name: Audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile driver
        run: python -m py_compile shor_order_finding_multinstance_fibre_v0_9_4.py
      - name: Verify frozen manifest
        run: sha256sum -c SHA256SUMS
      - name: Smoke audit
        run: |
          set +e
          python shor_order_finding_multinstance_fibre_v0_9_4.py \
            --instances 15:2 \
            --meta-seeds 1 \
            --bootstrap 100 \
            --json-out /tmp/shor_smoke_result.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          with open("/tmp/shor_smoke_result.json", encoding="utf-8") as f:
              result = json.load(f)
          row = result["records"][0]
          assert row["intrinsic_task_calls"] == 5500
          assert row["intrinsic_response_calls"] == 20
          assert row["random_task_calls"] == 5520
          assert row["spsa_task_calls"] == 5520
          PY
