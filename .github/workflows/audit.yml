name: Audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile driver
        run: python -m py_compile shor_order_finding_multinstance_fibre_v0_9_4.py
      - name: Compile disclosure tools
        run: |
          python -m py_compile tools/report_v0_9_4_disclosure.py
          python -m py_compile tools/verify_frozen_v0_9_4.py
      - name: Verify repository manifest
        run: sha256sum -c SHA256SUMS
      - name: Verify manuscript manifest
        run: sha256sum -c SHA256SUMS_MANUSCRIPT_v0.9.4-r2.txt
      - name: Verify frozen artifacts
        run: python tools/verify_frozen_v0_9_4.py
      - name: Run read-only disclosure report
        run: |
          python tools/report_v0_9_4_disclosure.py > /tmp/v094_disclosure.json
          python -m json.tool /tmp/v094_disclosure.json > /dev/null
